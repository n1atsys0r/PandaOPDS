# Publish PandaOPDS Docker image to GitHub Container Registry (ghcr.io).
#
# Triggers:
#   - push to `main`          → tags: latest, sha-<short>
#   - push to `refactor/pandaopds-go` → tags: test, sha-<short> (never latest)
#   - push tag `v*`           → tags: vX.Y.Z, vX.Y, vX
#   - manual (workflow_dispatch)
#
# The image is multi-arch (linux/amd64 + linux/arm64). Pull with:
#   docker pull ghcr.io/<owner>/<repo>:latest

name: Publish Docker image

on:
  push:
    branches: [main, "refactor/pandaopds-go"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/refactor/pandaopds-go' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=PandaOPDS
            org.opencontainers.image.description=OPDS-PSE streaming server proxying E-Hentai.org

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
